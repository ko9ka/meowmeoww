<title>Madk1d Insta</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #6d28d9, #a855f7);
  color: white;
}

.container {
  width: 420px;
  margin: 40px auto;
}

.card {
  background: rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 15px;
  backdrop-filter: blur(10px);
  margin-top: 20px;
}

/* АВАТАР */
.avatar {
  width: 45px;
  height: 45px;
  border-radius: 10px;
  overflow: hidden;
  background: #ddd;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* HEADER */
.header {
  display: flex;
  align-items: center;
  gap: 10px;
}

button {
  border: none;
  padding: 8px 12px;
  border-radius: 10px;
  cursor: pointer;
}

.login {
  background: white;
  color: #6d28d9;
}

.like {
  background: white;
  color: #6d28d9;
  margin-top: 10px;
}

.post-img {
  width: 100%;
  border-radius: 15px;
  margin-top: 10px;
}

.comment-box {
  display: flex;
  gap: 5px;
  margin-top: 10px;
}

input {
  flex: 1;
  padding: 8px;
  border-radius: 10px;
  border: none;
}

.comment {
  display: flex;
  gap: 10px;
  margin-top: 10px;
  align-items: center;
}

.comment .avatar {
  width: 30px;
  height: 30px;
}
</style>
</head>

  <button class="like" onclick="like()">❤️ Лайк <span id="likes">0</span></button>

  <div class="comment-box">
    <input id="commentInput" placeholder="Комментарий...">
    <button onclick="addComment()">Отправить</button>
  </div>

  <div id="comments"></div>

</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "qazaq-a072e.firebaseapp.com",
  projectId: "qazaq-a072e",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

let currentUser = null;

/* LOGIN */
window.login = async () => {
  try {
    await signInWithPopup(auth, provider);
  } catch (e) {
    console.log(e);
    alert("Ошибка входа");
  }
};

/* USER */
onAuthStateChanged(auth, (user) => {
  if (user) {
    currentUser = user;

    document.getElementById("userCard").style.display = "block";
    document.getElementById("userName").innerText = user.displayName;

    // ✔ АВАТАР ИЗ GOOGLE
    document.getElementById("userPhoto").src =
      user.photoURL || "https://i.imgur.com/2GU7c3X.png";
  }
});
</script>

<script>
let likes = 0;

function like() {
  likes++;
  document.getElementById("likes").innerText = likes;
}

function addComment() {
  let text = document.getElementById("commentInput").value;
  if (!text) return;

  let avatar = currentUser?.photoURL || "https://i.imgur.com/2GU7c3X.png";
  let name = currentUser?.displayName || "guest";

  let div = document.createElement("div");
  div.className = "comment";

  div.innerHTML = `
    <div class="avatar">
      <img src="${avatar}">
    </div>
    <div><b>${name}:</b> ${text}</div>
  `;

  document.getElementById("comments").appendChild(div);
  document.getElementById("commentInput").value = "";
}
</script>

</body>
