<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Madk1d Style</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(135deg, #a855f7, #6b21a8);
      color: white;
      text-align: center;
    }

    .card {
      margin: 50px auto;
      width: 300px;
      background: rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 20px;
      backdrop-filter: blur(10px);
    }

    img {
      width: 100%;
      border-radius: 15px;
    }

    button {
      background: white;
      color: #6b21a8;
      border: none;
      padding: 10px;
      margin-top: 10px;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      background: #ddd;
    }
  </style>
</head>

<body>

<h1>💜 MADK1D — покоряем Америку</h1>

<div class="card">
  <img src="https://images.unsplash.com/photo-1520975922284-9b4c3b0c2c7d" />
  <h2>madk1d aesthetic</h2>
  <p>we going global 🌍</p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup } 
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "qazaq-a072e.firebaseapp.com",
    projectId: "qazaq-a072e",
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  window.login = async () => {
    try {
      const result = await signInWithPopup(auth, provider);
      alert("Welcome " + result.user.displayName);
    } catch (e) {
      console.log(e);
      alert("Ошибка входа");
    }
  }
</script>

<button onclick="login()">Войти через Google</button>

</body>
</html>
