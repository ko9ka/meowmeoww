<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>madk1d Insta</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg, #f6f0ff, #eadcff);
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 0;
}

.container {
    width: 100%;
    max-width: 500px;
    background: white;
    padding: 15px;
    margin-top: 12px;
    border-radius: 16px;
    box-shadow: 0 8px 20px rgba(120, 80, 180, 0.15);
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 8px;
    border: 1px solid #e2d6ff;
    border-radius: 10px;
    background: #faf7ff;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    background: linear-gradient(135deg, #a56bff, #7c4dff);
    color: white;
    border-radius: 12px;
    font-weight: bold;
    cursor: pointer;
}

.post {
    background: white;
    padding: 15px;
    margin-top: 15px;
    border-radius: 18px;
    box-shadow: 0 6px 18px rgba(120, 80, 180, 0.12);
}

.post-header {
    display: flex;
    align-items: center;
    gap: 10px;
}

.post-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #a56bff;
}

.like-btn {
    margin-top: 10px;
    padding: 6px 12px;
    border-radius: 20px;
    border: none;
    background: #f3edff;
    color: #6b3fd4;
    cursor: pointer;
}

.time {
    font-size: 11px;
    color: #8b7aa8;
}

p {
    color: #3a2b55;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="container">
    <button id="loginBtn">💜 Войти через Google</button>

    <div id="userBox" style="display:none;">
        <p id="userName"></p>
        <button id="logoutBtn">Выйти</button>
    </div>
</div>

<!-- POST -->
<div class="container" id="postBox" style="display:none;">
    <input id="content" placeholder="Что нового? 💭">
    <input id="imageUrl" placeholder="Ссылка на картинку 🖼">
    <button id="postBtn">Опубликовать ✨</button>
</div>

<!-- FEED -->
<div id="feed"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, updateDoc, doc, increment, getDocs }
from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    projectId: "YOUR_PROJECT_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

/* LOGIN */
document.getElementById("loginBtn").onclick = () => signInWithPopup(auth, provider);
document.getElementById("logoutBtn").onclick = () => signOut(auth);

/* AUTH */
onAuthStateChanged(auth, (user) => {
    if (user) {
        document.getElementById("userBox").style.display = "block";
        document.getElementById("postBox").style.display = "block";
        document.getElementById("userName").innerText = "💜 " + user.displayName;
    } else {
        document.getElementById("userBox").style.display = "none";
        document.getElementById("postBox").style.display = "none";
    }
});

/* POST */
document.getElementById("postBtn").onclick = async () => {
    const text = document.getElementById("content").value;
    const image = document.getElementById("imageUrl").value;

    await addDoc(collection(db, "requests"), {
        name: auth.currentUser.displayName,
        photo: auth.currentUser.photoURL,
        text,
        image,
        likes: 0,
        timestamp: serverTimestamp()
    });

    document.getElementById("content").value = "";
    document.getElementById("imageUrl").value = "";
};

/* LIKE */
window.likePost = async (id) => {
    await updateDoc(doc(db, "requests", id), {
        likes: increment(1)
    });
};

/* 🔥 DEMO POSTS (madk1d added) */
async function createDemoPostsIfEmpty() {
    const snap = await getDocs(collection(db, "requests"));
    if (!snap.empty) return;

    const demoPosts = [
        {
            name: "madk1d",
            photo: "https://i.pravatar.cc/150?img=3",
            text: "Покоряем Америку 🇺🇸🔥",
            image: "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee",
            likes: 42
        },
        {
            name: "🌸 Dream Life",
            photo: "https://i.pravatar.cc/150?img=5",
            text: "Soft aesthetic 🌙",
            image: "https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e",
            likes: 24
        },
        {
            name: "🪻 Night Mood",
            photo: "https://i.pravatar.cc/150?img=12",
            text: "Late night vibes 💭",
            image: "https://images.unsplash.com/photo-1519681393784-d120267933ba",
            likes: 8
        },
        {
            name: "✨ Minimal Life",
            photo: "https://i.pravatar.cc/150?img=32",
            text: "Less is more 🤍",
            image: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1",
            likes: 15
        }
    ];

    for (let p of demoPosts) {
        await addDoc(collection(db, "requests"), {
            ...p,
            timestamp: serverTimestamp()
        });
    }
}

createDemoPostsIfEmpty();

/* FEED */
const q = query(collection(db, "requests"), orderBy("timestamp", "desc"));

onSnapshot(q, (snap) => {
    const feed = document.getElementById("feed");
    feed.innerHTML = "";

    snap.forEach((docu) => {
        const d = docu.data();
        const time = d.timestamp ? d.timestamp.toDate().toLocaleString() : "";

        feed.innerHTML += `
        <div class="post">

            <div class="post-header">
                <img src="${d.photo}" class="post-avatar">
                <div>
                    <b>${d.name}</b><br>
                    <span class="time">${time}</span>
                </div>
            </div>

            <p>${d.text || ""}</p>

            ${d.image ? `<img src="${d.image}" style="width:100%; border-radius:12px;">` : ""}

            <button class="like-btn" onclick="likePost('${docu.id}')">
                💜 ${d.likes || 0}
            </button>

        </div>
        `;
    });
});

</script>

</body>
</html>
